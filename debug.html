<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FACEPLANT — debug</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="./src/ui/tokens.css" />
<style>
  body { margin: 0; background: #07060A; color: #EDE6D6; font: 13px/1.5 "Inter", system-ui, sans-serif; }
  #wrap { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 12px; padding: 12px; height: 100vh; box-sizing: border-box; }
  #view { position: relative; background: #000; border: 1px solid #2B2236; min-width: 0; }
  #view canvas, #view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #panel { overflow: auto; font-family: "VT323", "Courier New", monospace; font-size: 16px; }
  #panel h2 { font: 400 15px "Special Elite", serif; letter-spacing: .06em; color: #9E968A; margin: 14px 0 6px; }
  .bar { height: 10px; background: #15121B; margin: 2px 0 6px; }
  .bar i { display: block; height: 100%; background: #FFB547; }
  button { font-family: "VT323", monospace; font-size: 16px; background: transparent; color: #EDE6D6; border: 1px solid #3a3342; padding: 4px 10px; cursor: pointer; }
  button.on { background: #FFB547; color: #1a1006; border-color: #FFB547; }
  pre { white-space: pre-wrap; color: #9E968A; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view"></div>
  <div id="panel"></div>
</div>
<script type="module" src="/src/debug.ts"></script>
</body>
</html>
