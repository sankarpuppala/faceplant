<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FACEPLANT — UI gallery</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="./src/ui/tokens.css" />
<style>
  body { margin: 0; background: #07060A; }
  #host { display: block; }
  /* In gallery mode each screen is shown in a box rather than full-bleed. */
  .gallery-item { padding: 24px; border-bottom: 1px solid #2B2236; }
  .gallery-item > h2 {
    font: 400 13px "IM Fell English SC", serif; letter-spacing: .1em; text-transform: uppercase;
    color: #5f5a52; margin: 0 0 12px;
  }
  .gallery-frame { position: relative; min-height: 420px; background: #07060A; border: 1px solid #1a1620; }
  .gallery-frame > * { position: absolute; inset: 0; }
  body.solo #host, body.solo #host > * { position: absolute; inset: 0; }
  /* The overflow report is read back from a screenshot: headless Chrome will
     not make its window narrower than ~504px for --dump-dom, but honours any
     width for --screenshot. */
  #measure-report {
    position: static; margin: 0; padding: 8px;
    font: 11px/1.45 "Courier New", monospace; color: #EDE6D6;
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>
  <div id="host"></div>
  <script type="module" src="./src/uigallery.ts"></script>
</body>
</html>
